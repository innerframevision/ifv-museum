<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inner Frame Vision — Museum</title>
<link rel="icon" type="image/png" href="log.png">

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #080604;
}

.entrance {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background-image: url("enter muzeum.png");
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
}

.enter-button {
    position: absolute;
    left: 50%;
    top: 75%;
    transform: translate(-50%, -50%);
    display: block;
    width: 31%;
    height: 7%;
    min-width: 250px;
    min-height: 55px;
    z-index: 10;
    cursor: pointer;
}
@media (max-width: 700px) {
  .enter-button {
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    transform: none;
  }
}
    
</style>
</head>

<body>

<div class="entrance">
    <a
        class="enter-button"
       href="https://payhip.com/order?link=1mgey"
        aria-label="Enter the Inner Frame Vision Museum">
    </a>
</div>

</body>
</html>
