<title>Inner Frame Vision — Tabularium</title>

<style>

html, body{

    margin:0;

    min-height:100%;

    background:linear-gradient(to bottom,#666666 0%,#000000 45%,#000000 100%);

    font-family:Arial, sans-serif;

    color:#9b7843;

}

body{

    display:flex;

    flex-direction:column;

    align-items:center;

}

.logo{

    width:60px;

    margin-top:60px;

    margin-bottom:35px;

}

.title{

    color:#b8924f;

    font-size:42px;

    letter-spacing:8px;

    font-weight:normal;

    margin:0 0 8px 0;

    text-align:center;

}

.subtitle{

    color:#8f7843;

    font-size:18px;

    letter-spacing:12px;

    margin-bottom:70px;

    text-align:center;

}

.gallery{

    width:80vw;

    max-width:1000px;

    display:grid;

    grid-template-columns:repeat(3, 1fr);

    gap:38px;

    margin-bottom:90px;

}

.gallery a{

    display:block;

    border:3px solid #7c5a2f;

    background:#111;

    overflow:hidden;

    transition:0.3s;

}

.gallery a:hover{

    transform:scale(1.03);

}

.gallery img{

    width:100%;

    display:block;

}

.footer{

    max-width:900px;

    width:80%;

    color:#9b7843;

    font-size:12px;

    line-height:1.6;

    text-align:center;

    margin-bottom:50px;

}
.tabularium-content{
    width:80vw;
    max-width:650px;
    display:flex;
    flex-direction:column;
    gap:55px;
    margin-bottom:90px;
}

.tabularium-item{
    display:block;
    border:3px solid #7c5a2f;
    background:#111;
    overflow:hidden;
    transition:0.3s;
}

.tabularium-item:hover{
    transform:scale(1.02);
}

.tabularium-item img{
    width:100%;
    display:block;
}
@media (max-width:800px){

    .title{

        font-size:30px;

        letter-spacing:5px;

    }

    .subtitle{

        font-size:15px;

        letter-spacing:8px;

    }

    .gallery{

        grid-template-columns:1fr;

        width:82vw;

    }

}

</style>
